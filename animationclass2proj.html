<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            background-color:  black;
            height:100vh;
            width:100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
        }
        .main {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .circle {
            height:40px;
            width:40px;
            border-radius: 50%;
            animation: anime 1s alternate ease-in-out infinite;
        }
        .circle:nth-child(1) {
            background: linear-gradient(blue, red);
        }
        .circle:nth-child(2) {
            background:linear-gradient(green, orange);
            animation-delay:0.2s;

        }
        .circle:nth-child(3) {
            background:linear-gradient(violet, blue);
            animation-delay:0.4s;
        }
        @keyframes anime {
            0% {
                transform: translateY(0) scale(1);
                opacity: 0.5s;
            }
            50% {
                transform: translateY(-40px) scale(1.3);
                opacity: 1s;
            }
            100% {
                transform: translateY(0) scale(1);
                opacity: 0.5s;

            }
        }
    </style>
</head>
<body>
    <div class="main">
    <div class="circle"></div>
    <div class="circle"></div>
    <div class="circle"></div>
    </div>
</body>
</html>
